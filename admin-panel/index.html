<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2Z Admin Panel</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <section id="loginCard" class="card">
      <h1>M2Z Admin Login</h1>
      <p class="muted">Use the temporary credentials configured for this panel.</p>
      <form id="loginForm">
        <label>Username<input id="username" required /></label>
        <label>Password<input id="password" type="password" required /></label>
        <button type="submit">Login</button>
      </form>
      <p id="loginError" class="error hidden">Invalid credentials.</p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="header-row">
        <h1>M2Z Site Admin</h1>
        <button id="logoutBtn" class="secondary">Logout</button>
      </div>

      <div class="card grid-2">
        <label>Cache Bridge Base URL
          <input id="baseUrl" value="https://m2zpicks-cache-bridge.m2zinnovative.workers.dev" />
        </label>
        <label>Refresh Token
          <input id="refreshToken" placeholder="Paste x-refresh-token" />
        </label>
      </div>

      <div class="controls">
        <button data-action="health">Check Health</button>
        <button data-action="stats">Get Stats</button>
        <button data-action="categories">Get Categories</button>
        <button data-action="tools">Get Tools</button>
        <button data-action="latest">Get Latest</button>
        <button data-action="refresh" class="warn">Force Refresh</button>
      </div>

      <div class="card">
        <h3>Quick Summary</h3>
        <div id="summary" class="summary">No data yet.</div>
      </div>

      <div class="card">
        <h3>Response</h3>
        <pre id="output">Run an action to view data...</pre>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
